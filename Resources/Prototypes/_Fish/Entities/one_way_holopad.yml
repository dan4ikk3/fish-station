# Односторонняя сеть голопадов. Изолирована от обычных голопадов: с обычных на неё и с неё на обычные
# позвонить нельзя, видимость в списках контактов и запрет звонков держит OneWayHolopadSystem.
# Передатчики и приёмники с одинаковым channel образуют одну сеть (по умолчанию "default").
# unlistedNumber здесь нарочно не ставится: список контактов передатчика строится хуком в HolopadSystem.
- type: entity
  abstract: true
  parent: Holopad
  id: FishOneWayHolopadBase
  name: терминал связи
  description: Специализированный терминал одностороннего вещания, отделённый от общей сети голопадов.
  components:
  - type: Telephone
    transmissionRange: Unlimited # передатчик стоит на ЦК, приёмник на станции — разные карты
  - type: OneWayHolopad

# Передатчик: с него звонят, звонящий видит и слышит окружение приёмника и замораживается на время звонка.
- type: entity
  parent: FishOneWayHolopadBase
  id: FishHolopadTransmitter
  name: скрытый передатчик
  description: Одностороннее устройство наблюдения.
  components:
  - type: OneWayHolopad
    isTransmitter: true
    # channel: default # у пары передатчик/приёмник должен совпадать; другой канал — отдельная сеть

# Приёмник: показывает голограмму звонящего и передаёт своё окружение.
- type: entity
  parent: FishOneWayHolopadBase
  id: FishHolopadReceiver
  name: терминал приёма
  description: Принимает одностороннюю трансляцию.
  components:
  - type: OneWayHolopad
    isTransmitter: false
  - type: Telephone
    listeningRange: 5
